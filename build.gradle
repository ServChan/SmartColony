plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

sourceSets {
    devbridge {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        "smartcolony" {
            sourceSet sourceSets.main
        }
        "smartcolony_devbridge" {
            sourceSet sourceSets.devbridge
        }
    }

    runs {
        devServer {
            server()
            name = "Dev Server with MCP bridge"
            source sourceSets.devbridge
            runDir "run-dev"
        }
        devClient {
            client()
            name = "Dev Client with MCP bridge"
            source sourceSets.devbridge
            runDir "run-dev-client"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api-base:${project.fabric_api_base_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_version}"
    implementation "net.fabricmc.fabric-api:fabric-command-api-v2:${project.fabric_command_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-entity-events-v1:${project.fabric_entity_events_version}"
    implementation "net.fabricmc.fabric-api:fabric-events-interaction-v0:${project.fabric_events_interaction_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.10.1"
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
